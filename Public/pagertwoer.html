@keyframes fadeIn {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.fade-words span {
  opacity: 0;
  transform: translateY(10px); /* optional slight upward float */
  display: inline-block;
  animation: fadeIn 0.6s ease-out forwards;
}

/* Stagger the delay for each word */
.fade-words span:nth-of-type(1) { animation-delay: 0.5s; }
.fade-words span:nth-of-type(2) { animation-delay: 4s; }
.fade-words span:nth-of-type(3) { animation-delay: 7s; }
.fade-words span:nth-of-type(4) { animation-delay: 11s; }
.fade-words span:nth-of-type(5) { animation-delay: 16s; }
.fade-words span:nth-of-type(6) { animation-delay: 18s; }

</style>
